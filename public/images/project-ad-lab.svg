<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <radialGradient id="adBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3a0d18" />
      <stop offset="55%" stop-color="#18080d" />
      <stop offset="100%" stop-color="#090507" />
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#e11d48" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#adBg)" />

  <!-- Ambient glowing nebula -->
  <circle cx="310" cy="185" r="160" fill="url(#nodeGlow)" opacity="0.45" />
  <circle cx="190" cy="140" r="110" fill="url(#nodeGlow)" opacity="0.3" />
  <circle cx="430" cy="220" r="120" fill="url(#nodeGlow)" opacity="0.3" />

  <!-- Subtle background plexus lines -->
  <g stroke="#881337" stroke-width="0.8" opacity="0.55">
    <line x1="60" y1="80" x2="150" y2="120" />
    <line x1="150" y1="120" x2="110" y2="230" />
    <line x1="110" y1="230" x2="210" y2="280" />
    <line x1="150" y1="120" x2="250" y2="90" />
    <line x1="250" y1="90" x2="310" y2="180" />
    <line x1="210" y1="280" x2="310" y2="180" />
    <line x1="210" y1="280" x2="340" y2="300" />
    <line x1="340" y1="300" x2="430" y2="230" />
    <line x1="310" y1="180" x2="420" y2="110" />
    <line x1="420" y1="110" x2="520" y2="150" />
    <line x1="430" y1="230" x2="520" y2="150" />
    <line x1="430" y1="230" x2="530" y2="290" />
    <line x1="250" y1="90" x2="420" y2="110" />
    <line x1="110" y1="230" x2="250" y2="90" />
  </g>

  <!-- Primary Attack Path Lines -->
  <g stroke="#f43f5e" stroke-width="1.6" opacity="0.85" filter="url(#glow)">
    <line x1="150" y1="120" x2="310" y2="180" />
    <line x1="310" y1="180" x2="430" y2="230" />
    <line x1="310" y1="180" x2="340" y2="300" />
    <line x1="250" y1="90" x2="310" y2="180" />
    <line x1="420" y1="110" x2="430" y2="230" />
  </g>

  <!-- Network Nodes -->
  <g filter="url(#glow)">
    <circle cx="60" cy="80" r="3" fill="#fda4af" />
    <circle cx="150" cy="120" r="5.5" fill="#fb7185" />
    <circle cx="110" cy="230" r="4" fill="#f43f5e" />
    <circle cx="210" cy="280" r="4.5" fill="#fb7185" />
    <circle cx="250" cy="90" r="5" fill="#fda4af" />
    <!-- Central Domain Controller Node -->
    <circle cx="310" cy="180" r="14" fill="#e11d48" opacity="0.35" />
    <circle cx="310" cy="180" r="7.5" fill="#ffe4e6" />
    <circle cx="340" cy="300" r="5" fill="#fb7185" />
    <circle cx="420" cy="110" r="5.5" fill="#fda4af" />
    <circle cx="430" cy="230" r="6.5" fill="#ffe4e6" />
    <circle cx="520" cy="150" r="4" fill="#f43f5e" />
    <circle cx="530" cy="290" r="3.5" fill="#fb7185" />
  </g>

  <!-- Floating Particles -->
  <g fill="#f5d0c5" opacity="0.55">
    <circle cx="95" cy="155" r="1.5" />
    <circle cx="185" cy="65" r="1.2" />
    <circle cx="280" cy="135" r="1.8" />
    <circle cx="365" cy="150" r="1.4" />
    <circle cx="380" cy="255" r="1.6" />
    <circle cx="475" cy="185" r="1.5" />
    <circle cx="260" cy="235" r="1.3" />
    <circle cx="160" cy="310" r="1.2" />
  </g>
</svg>

